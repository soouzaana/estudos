<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estudos para Concursos</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#7c3aed"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--a:#7c3aed;--bg:#f7f6fb;--card:#fff;--tx:#1d1b2e;--mu:#6b6880;--bd:#e5e2f0;--ok:#16a34a;--er:#dc2626}
:root[data-m=dark]{--bg:#121019;--card:#1c1928;--tx:#f0eefa;--mu:#9b97b3;--bd:#2d2940}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
main{max-width:760px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.mu{color:var(--mu);font-size:13px}
button,.b{background:var(--a);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;min-height:42px;cursor:pointer}
button.g{background:transparent;color:var(--a);border:1px solid var(--bd)}button.s{padding:6px 10px;min-height:34px;font-size:13px}button.d{background:var(--er)}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:3px 0 8px}
label{font-size:13px;color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav a{flex:1;min-width:64px;text-align:center;padding:6px 4px;color:var(--mu);font-size:11px;text-decoration:none;border-radius:10px;cursor:pointer}nav a.on{color:var(--a);background:color-mix(in srgb,var(--a) 12%,transparent);font-weight:700}
nav a b{display:block;font-size:19px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
.t{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;background:color-mix(in srgb,var(--a) 14%,transparent);color:var(--a)}
.m{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9}.m>div{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal i{aspect-ratio:1;border-radius:6px;background:var(--bd);font-size:11px;display:grid;place-items:center;font-style:normal}
.cal .e{background:var(--a);color:#fff}.cal .k{background:#f59e0b;color:#fff}
.fc{min-height:160px;display:grid;place-items:center;text-align:center;font-size:18px;cursor:pointer;white-space:pre-wrap}
</style></head><body><main id="v"></main><nav id="n"></nav>
<script src="logic.js"></script>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10),hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},br=d=>d.split('-').reverse().join('/');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},hm=s=>Math.floor(s/3600)+'h'+String(Math.floor(s%3600/60)).padStart(2,'0');
let D={concursos:[],atividades:[],sessoes:[],questoes:[],erros:[],cards:[],cfg:{cor:'#7c3aed',modo:'auto',metaDia:7200,metaQ:30},timer:null};
// ---- persistência IndexedDB
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('estudos',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=no});
async function load(){try{const d=await idb();const v=await new Promise(ok=>{const q=d.transaction('kv').objectStore('kv').get('db');q.onsuccess=()=>ok(q.result)});if(v)D=Object.assign(D,v)}catch(e){}L.migrar(D)}
async function save(){try{L.migrar(D);const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(D)),'db')}catch(e){alert('Erro ao salvar: '+e.message)}}
function tema(){const r=document.documentElement,m=D.cfg.modo==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):D.cfg.modo;r.dataset.m=m;r.style.setProperty('--a',D.cfg.cor);document.querySelector('meta[name=theme-color]').content=D.cfg.cor}
// ---- util
const conc=id=>D.concursos.find(c=>c.id===id)?.nome||'—',opts=(l,sel)=>l.map(x=>`<option value="${esc(x[0])}" ${x[0]===sel?'selected':''}>${esc(x[1])}</option>`).join('');
const ativos=()=>D.concursos.filter(c=>c.status==='preparacao');
const concOpts=()=>opts(ativos().map(c=>[c.id,c.nome]));
function sessTempo(s){return s.seg}
function modal(t,campos,onOk,extra=''){const m=document.createElement('div');m.className='m';m.innerHTML=`<div><h2>${t}</h2><form>${campos}<div class="r"><button>Salvar</button><button type="button" class="g" data-x>Cancelar</button></div></form>${extra}</div>`;
document.body.append(m);m.onclick=e=>{if(e.target===m||e.target.dataset.x!==undefined)m.remove()};
m.querySelector('form').onsubmit=async e=>{e.preventDefault();const f={};new FormData(e.target).forEach((v,k)=>{f[k]=k in f?[].concat(f[k],v):v});const err=await onOk(f);if(err){alert(err);return}m.remove();await save();go()}}
const fld=(n,l,t='text',v='',x='')=>`<label>${l}</label><input name="${n}" type="${t}" value="${esc(v)}" ${x}>`;
const sel=(n,l,o)=>`<label>${l}</label><select name="${n}">${o}</select>`;
const discs=()=>[...new Set([...D.disciplinas.map(d=>d.nome),...D.atividades,...D.sessoes,...D.questoes,...D.cards].map(x=>x.disc||x).filter(x=>typeof x==='string'&&x))];
const dl=()=>`<datalist id="dl">${discs().map(d=>`<option value="${esc(d)}">`).join('')}</datalist>`;
const fdisc=v=>`<label>Disciplina</label><input name="disc" list="dl" value="${esc(v||'')}" required>${dl()}`;
// ---- views
const V={};
V.inicio=()=>{const h=hoje(),ss=D.sessoes.filter(s=>s.data===h),seg=ss.reduce((a,s)=>a+s.seg,0)+(D.timer?tAtual():0),qs=D.questoes.filter(q=>q.data===h),tot=qs.reduce((a,q)=>a+q.total,0),ac=qs.reduce((a,q)=>a+q.acertos,0),p=Math.min(100,seg/D.cfg.metaDia*100);
const pend=D.atividades.filter(a=>a.status==='pendente'||a.status==='andamento').sort((a,b)=>a.data.localeCompare(b.data)||a.ordem-b.ordem);
const dia=pend.filter(a=>a.data<=h);
return`<h1>Hoje, ${br(h)}</h1><div class="c"><div class="r sp"><b>${hm(seg)} de ${hm(D.cfg.metaDia)}</b><span class="mu">${p.toFixed(0)}%</span></div><div class="bar"><i style="width:${p}%"></i></div>
<p class="mu">${tot} questões · ${ac} acertos · ${tot?(ac/tot*100).toFixed(0):0}% de aproveitamento (meta ${D.cfg.metaQ}) · ${dia.length} atividade(s) para hoje ou atrasadas</p></div>
<h2>Atividades do dia</h2>${dia.map(actCard).join('')||'<div class="c mu">Nenhuma atividade pendente. Crie em Cronograma.</div>'}
<h2>Concursos ativos</h2>${ativos().map(c=>{const a=D.atividades.filter(x=>x.conc===c.id),f=a.filter(x=>x.status==='concluida').length,s=D.sessoes.filter(x=>x.conc===c.id).reduce((t,x)=>t+x.seg,0),q=D.questoes.filter(x=>x.conc===c.id),t=q.reduce((n,x)=>n+x.total,0),k=q.reduce((n,x)=>n+x.acertos,0);
return`<div class="c"><b>${esc(c.nome)}</b> <span class="mu">${esc(c.orgao||'')} ${esc(c.cargo||'')}</span><div class="bar"><i style="width:${a.length?f/a.length*100:0}%"></i></div><p class="mu">${f}/${a.length} atividades · ${hm(s)} · ${t?(k/t*100).toFixed(0)+'%':'sem questões'} ${c.prova?'· prova '+br(c.prova):''}</p></div>`}).join('')||'<div class="c mu">Cadastre um concurso em Concursos.</div>'}
<h2>Consistência (28 dias)</h2><div class="c"><div class="cal">${Array.from({length:28},(_,i)=>{const d=new Date();d.setDate(d.getDate()-27+i);const k=d.toISOString().slice(0,10),loc=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),est=D.sessoes.some(s=>s.data===loc),pu=D.atividades.some(a=>a.feitoEm===loc&&a.status==='pulada');return`<i class="${est?'e':pu?'k':''}">${d.getDate()}</i>`}).join('')}</div><p class="mu">Roxo: estudou · Laranja: pulou · Cinza: sem registro</p></div>`};
function actCard(a){return`<div class="c"><div class="r sp"><b>${esc(a.disc)}</b><span class="tag">${a.status}</span></div><div class="mu">${esc(conc(a.conc))} · ${esc(a.topico||'')} · ${a.min} min previstos · ${br(a.data)}</div>
<div class="r" style="margin-top:8px"><button class="s" data-a="ini" data-id="${a.id}">▶ Iniciar</button><button class="s g" data-a="ok" data-id="${a.id}">Concluir</button><button class="s g" data-a="pul" data-id="${a.id}">Pular</button><button class="s g" data-a="reag" data-id="${a.id}">Reagendar</button></div></div>`}
V.concursos=()=>`<div class="r sp"><h1>Concursos</h1><button data-a="nconc">+ Novo</button></div><div class="c"><div class="r sp"><h2>Disciplinas</h2><button class="s" data-a="ndisc">+ Disciplina</button></div>${D.disciplinas.map(d=>`<div class="r sp" style="padding:4px 0"><span>${esc(d.nome)} <span class="mu">${d.topicos.length} tópicos · ${d.concs.map(conc).join(', ')||'sem concurso'}</span></span><span><button class="s g" data-a="edisc" data-id="${d.id}">Editar</button> <button class="s g" data-a="xdisc" data-id="${d.id}">✕</button></span></div>`).join('')||'<span class="mu">Nenhuma disciplina.</span>'}</div>${D.concursos.map(c=>`<div class="c"><div class="r sp"><b>${esc(c.nome)}</b><span class="tag">${{preparacao:'Em preparação',pausado:'Pausado',concluido:'Concluído',arquivado:'Arquivado'}[c.status]}</span></div><div class="mu">${esc(c.orgao||'')} · ${esc(c.cargo||'')} · ${esc(c.banca||'')} · edital: ${esc(c.edital||'—')} ${c.prova?'· prova '+br(c.prova):''}</div><div class="r" style="margin-top:8px"><button class="s g" data-a="econc" data-id="${c.id}">Editar</button><button class="s g" data-a="xconc" data-id="${c.id}">Excluir</button></div></div>`).join('')||'<div class="c mu">Nenhum concurso cadastrado.</div>'}`;
let cr={modo:'dia',ref:hoje(),conc:''};
V.cronograma=()=>{const[i,f]=cr.modo==='dia'?[cr.ref,cr.ref]:L.periodo(cr.modo,cr.ref),l=D.atividades.filter(a=>a.data>=i&&a.data<=f&&(!cr.conc||a.conc===cr.conc)).sort((a,b)=>a.data.localeCompare(b.data)||a.ordem-b.ordem);
const card=a=>`<div class="c"><div class="r sp"><b>${esc(a.disc)}</b><span class="tag">${a.status}</span></div><div class="mu">${br(a.data)} · ${esc(conc(a.conc))} · ${esc(a.topico||'')} · ${a.min} min${a.feitoEm?' · registrado em '+br(a.feitoEm):''}${a.hist.length?' · '+a.hist.length+' mudança(s)':''}</div><div class="r" style="margin-top:6px"><button class="s g" data-a="st" data-id="${a.id}">Status</button><button class="s g" data-a="reag" data-id="${a.id}">Reagendar</button><button class="s g" data-a="eat" data-id="${a.id}">Editar</button><button class="s g" data-a="xat" data-id="${a.id}">Excluir</button></div></div>`;
let corpo;if(cr.modo==='mes'){const p=new Date(i+'T12:00:00').getDay(),n=+f.slice(8);corpo=`<div class="c"><div class="cal">${'DSTQQSS'.split('').map(x=>`<span class="mu" style="text-align:center">${x}</span>`).join('')}${'<i style="background:none"></i>'.repeat(p)}${Array.from({length:n},(_,k)=>{const d=i.slice(0,8)+String(k+1).padStart(2,'0'),at=D.atividades.filter(a=>a.data===d&&(!cr.conc||a.conc===cr.conc));const cl=at.length&&at.every(a=>a.status==='concluida')?'e':at.some(a=>a.status==='pulada')?'k':'';return`<i class="${cl}" data-a="vdia" data-d="${d}" style="cursor:pointer;${d===hoje()?'outline:2px solid var(--a)':''}">${k+1}${at.length?'<small>·'+at.length+'</small>':''}</i>`}).join('')}</div><p class="mu">Roxo: tudo concluído · Laranja: há puladas · toque no dia para abrir</p></div>`}else corpo=l.map(card).join('');
const tit=cr.modo==='dia'?br(cr.ref):cr.modo==='semana'?br(i)+' – '+br(f):cr.ref.slice(5,7)+'/'+cr.ref.slice(0,4);
return`<div class="r sp"><h1>Cronograma</h1><button data-a="nat">+ Atividade</button></div><div class="c"><div class="r">${['dia','semana','mes'].map(m=>`<button class="s ${cr.modo===m?'':'g'}" data-a="cmodo" data-m="${m}">${{dia:'Dia',semana:'Semana',mes:'Mês'}[m]}</button>`).join('')}<select data-crc style="width:auto;margin:0"><option value="">Todos</option>${opts(D.concursos.map(c=>[c.id,c.nome]),cr.conc)}</select></div><div class="r sp" style="margin-top:8px"><button class="s g" data-a="cnav" data-n="-1">‹</button><b>${tit}</b><button class="s g" data-a="cnav" data-n="1">›</button></div><button class="s g" data-a="chj">Hoje</button></div>${corpo}${cr.modo!=='mes'&&!l.length?'<div class="c mu">Sem atividades neste período. Pular não apaga: o histórico é mantido.</div>':''}`};
function tAtual(){const t=D.timer;return t.acc+(t.run?(Date.now()-t.ini)/1000:0)}
V.estudos=()=>{const t=D.timer,l=[...D.sessoes].reverse().slice(0,40);
return`<h1>Estudos</h1><div class="c">${t?`<div class="mu">${esc(t.disc)} · ${esc(conc(t.conc))}</div><div class="t" id="tm">${fmt(tAtual())}</div><div class="r" style="justify-content:center">${t.run?'<button data-a="tp">Pausar</button>':'<button data-a="tc">Continuar</button>'}<button class="g" data-a="tf">Finalizar</button><button class="g" data-a="tx">Descartar</button></div>`:`<div class="t">00:00:00</div><div class="r" style="justify-content:center"><button data-a="tn">Iniciar cronômetro</button><button class="g" data-a="ns">Registro manual</button></div>`}</div>
<h2>Histórico</h2>${l.map(s=>`<div class="c"><div class="r sp"><b>${esc(s.disc)}</b><span>${hm(s.seg)}</span></div><div class="mu">${br(s.data)} · ${esc(conc(s.conc))} · ${esc(s.metodo)} ${esc(s.topico||'')}</div><button class="s g" data-a="xs" data-id="${s.id}">Excluir</button></div>`).join('')||'<div class="c mu">Nenhuma sessão registrada.</div>'}`};
V.questoes=()=>{const l=[...D.questoes].reverse();return`<div class="r sp"><h1>Questões</h1><button data-a="nq">+ Registrar</button></div>${l.map(q=>`<div class="c"><div class="r sp"><b>${esc(q.disc)}</b><span>${q.acertos}/${q.total} · ${(q.total?q.acertos/q.total*100:0).toFixed(0)}%</span></div><div class="mu">${br(q.data)} · ${esc(conc(q.conc))} · ${esc(q.fonte||'')} · ${q.total-q.acertos} erros</div><button class="s g" data-a="xq" data-id="${q.id}">Excluir</button></div>`).join('')||'<div class="c mu">Nenhum registro. Ao registrar erros, é possível cadastrá-los direto no caderno.</div>'}`};
let fe={c:'',d:'',q:''};
V.erros=()=>{let l=D.erros.filter(e=>!e.arq&&(!fe.c||e.conc===fe.c)&&(!fe.d||e.disc===fe.d)&&(!fe.q||(e.enun+e.expl).toLowerCase().includes(fe.q.toLowerCase())));
return`<div class="r sp"><h1>Caderno de erros</h1><button data-a="ne">+ Erro</button></div><div class="c"><select data-f="c"><option value="">Todos os concursos</option>${opts(D.concursos.map(c=>[c.id,c.nome]),fe.c)}</select><select data-f="d"><option value="">Todas as disciplinas</option>${opts(discs().map(d=>[d,d]),fe.d)}</select><input data-f="q" placeholder="Buscar" value="${esc(fe.q)}"></div>
${l.map(e=>`<div class="c"><div class="r sp"><b>${esc(e.disc)}</b><span class="tag">${esc(e.motivo)}</span></div><p>${esc(e.enun)}</p><div class="mu">Marquei: ${esc(e.marcou||'—')} · Correta: ${esc(e.correta||'—')} · ${esc(conc(e.conc))} · ${br(e.data)}</div>${e.expl?`<p class="mu">${esc(e.expl)}</p>`:''}<div class="r"><button class="s" data-a="rev" data-id="${e.id}">Revisado (${e.revs.length})</button><button class="s g" data-a="e2c" data-id="${e.id}">${D.cards.some(c=>c.erro===e.id)?'Já é flashcard':'→ Flashcard'}</button><button class="s g" data-a="arq" data-id="${e.id}">Arquivar</button></div></div>`).join('')||'<div class="c mu">Nenhum erro encontrado.</div>'}`};
let fcAt=null,fcShow=false;
V.flash=()=>{const h=hoje(),dev=D.cards.filter(c=>c.prox<=h).sort((a,b)=>a.prox.localeCompare(b.prox)),c=dev[0];fcAt=c;
return`<div class="r sp"><h1>Flashcards</h1><button data-a="nc">+ Novo</button></div><p class="mu">${dev.length} para revisar · ${D.cards.length} no total</p>${c?`<div class="c fc" data-a="flip">${esc(fcShow?c.verso:c.frente)}</div>${fcShow?`<div class="r"><button class="d" data-a="gr" data-g="1">Errei</button><button class="g" data-a="gr" data-g="2">Difícil</button><button data-a="gr" data-g="3">Bom</button><button class="g" data-a="gr" data-g="4">Fácil</button></div>`:'<button data-a="flip">Mostrar resposta</button>'}`:'<div class="c mu">Nada vencido. Crie cartões ou volte amanhã.</div>'}`};
let dp={modo:'semana',ref:hoje(),conc:'',disc:''};
V.desempenho=()=>{const[i,f]=L.periodo(dp.modo,dp.ref),S=L.stats(D,{ini:i,fim:f,conc:dp.conc,disc:dp.disc,hoje:hoje()}),pr=L.periodo(dp.modo,L.moverPeriodo(dp.modo,dp.ref,-1)),P=L.stats(D,{ini:pr[0],fim:pr[1],conc:dp.conc,disc:dp.disc,hoje:hoje()});
const dias=Object.entries(S.porDia),mx=Math.max(1,...dias.map(([,x])=>x.seg)),q=dias.filter(([,x])=>x.t);
const dif=(a,b,u)=>b?` (${a-b>=0?'+':''}${(a-b).toFixed(u==='h'?0:1)}${u==='h'?' min':' pp'} vs. período anterior)`:'';
const baixos=Object.entries(S.porDisc).filter(([,x])=>x.t>=10&&x.a/x.t<0.6).map(([d,x])=>`${d} (${(x.a/x.t*100).toFixed(0)}%)`);
const pend=D.erros.filter(e=>!e.arq&&!e.revs.length).length,venc=D.cards.filter(c=>c.prox<=hoje()).length;
return`<h1>Desempenho</h1><div class="c"><div class="r">${['semana','mes'].map(m=>`<button class="s ${dp.modo===m?'':'g'}" data-a="dmodo" data-m="${m}">${m==='mes'?'Mensal':'Semanal'}</button>`).join('')}</div><div class="r sp" style="margin:8px 0"><button class="s g" data-a="dnav" data-n="-1">‹</button><b>${br(i)} – ${br(f)}</b><button class="s g" data-a="dnav" data-n="1">›</button></div><select data-dpc><option value="">Todos os concursos</option>${opts(D.concursos.map(c=>[c.id,c.nome]),dp.conc)}</select><select data-dpd><option value="">Todas as disciplinas</option>${opts(discs().map(d=>[d,d]),dp.disc)}</select></div>
<div class="c"><b>${hm(S.seg)}</b> estudadas${dif(Math.round(S.seg/60),Math.round(P.seg/60),'h')}<br>${S.dias} de ${S.decorridos} dias com estudo (consistência ${S.consist.toFixed(0)}%) · média ${S.dias?hm(S.seg/S.dias):'—'}/dia estudado<br>${S.T} questões · ${S.A} acertos · ${S.erros} erros · ${S.T?S.aprov.toFixed(1)+'%':'sem questões'}${S.T&&P.T?dif(S.aprov,P.aprov,'p'):''}<br>Atividades: ${S.concluidas} concluídas · ${S.puladas} puladas · ${S.pendentes} pendentes<br>${pend} erros sem revisão · ${venc} cartões vencidos (situação atual)</div>
<div class="c"><h2>Horas por dia</h2><div class="r" style="align-items:end;height:110px;flex-wrap:nowrap;gap:2px">${dias.map(([k,v])=>`<div style="flex:1;text-align:center"><div style="background:var(--a);border-radius:4px;height:${v.seg/mx*80}px"></div><span class="mu" style="font-size:10px">${k.slice(8)}</span></div>`).join('')}</div></div>
<div class="c"><h2>Aproveitamento por dia</h2>${q.map(([k,v])=>`<div class="r"><span class="mu" style="width:44px">${k.slice(8)}/${k.slice(5,7)}</span><div class="bar" style="flex:1"><i style="width:${v.a/v.t*100}%"></i></div><span class="mu">${(v.a/v.t*100).toFixed(0)}% (${v.t})</span></div>`).join('')||'<span class="mu">Sem questões no período.</span>'}</div>
<div class="c"><h2>Por disciplina</h2>${Object.entries(S.porDisc).map(([d,x])=>`<div class="r sp"><span>${esc(d)}</span><span class="mu">${hm(x.seg)} · ${x.t?(x.a/x.t*100).toFixed(0)+'% de '+x.t:'sem questões'}</span></div>`).join('')||'<span class="mu">Sem dados.</span>'}</div>
<div class="c"><h2>Pontos de atenção</h2>${baixos.length?'Aproveitamento abaixo de 60% (mín. 10 questões): '+esc(baixos.join(', ')):'<span class="mu">Nenhum alerta com os dados do período.</span>'}</div>`};
V.config=()=>`<h1>Configurações</h1><div class="c"><label>Cor do tema</label><div class="r">${['#7c3aed','#ec4899','#2563eb','#16a34a','#a78bfa','#52525b'].map(c=>`<button style="background:${c};width:42px" data-a="cor" data-c="${c}"></button>`).join('')}<input type="color" value="${D.cfg.cor}" data-a="cor2" style="width:60px;padding:2px"></div>
<label>Aparência</label><select data-cfg="modo">${opts([['auto','Automático'],['light','Claro'],['dark','Escuro']],D.cfg.modo)}</select>
<label>Meta diária (minutos)</label><input type="number" data-cfg="metaDia" value="${D.cfg.metaDia/60}"><label>Meta diária de questões</label><input type="number" data-cfg="metaQ" value="${D.cfg.metaQ}"></div>
<div class="c"><button class="g" data-a="exp">Exportar backup (JSON)</button> <button class="g" data-a="imp">Importar backup</button></div>`;
const tabs=[['inicio','🏠','Início'],['concursos','🎯','Concursos'],['cronograma','🗓','Cronograma'],['estudos','⏱','Estudos'],['questoes','✍️','Questões'],['erros','📕','Erros'],['flash','🃏','Cards'],['desempenho','📊','Dados'],['config','⚙️','Config']];
let tab=location.hash.slice(1)||'inicio';
function go(){if(!V[tab])tab='inicio';$('#n').innerHTML=tabs.map(([k,i,l])=>`<a class="${k===tab?'on':''}" data-t="${k}"><b>${i}</b>${l}</a>`).join('');$('#v').innerHTML=V[tab]();tema()}
setInterval(()=>{const e=$('#tm');if(e&&D.timer)e.textContent=fmt(tAtual())},500);
// ---- ações
function sessao(conc,disc,topico,seg,metodo,data,act){D.sessoes.push({id:uid(),conc,disc,topico,seg:Math.round(seg),metodo,data:data||hoje(),act:act||null})}
const sm2=(c,g)=>L.sm2(c,g,hoje());
function setSt(a,s){if(a.status===s)return;a.hist.push({d:hoje(),de:a.status,para:s});a.status=s;a.feitoEm=['concluida','pulada'].includes(s)?hoje():null}
const A={
cmodo:(_,e)=>{cr.modo=e.dataset.m;go()},cnav:(_,e)=>{cr.ref=L.moverPeriodo(cr.modo,cr.ref,+e.dataset.n);go()},chj:()=>{cr.ref=hoje();go()},vdia:(_,e)=>{cr.ref=e.dataset.d;cr.modo='dia';go()},
dmodo:(_,e)=>{dp.modo=e.dataset.m;go()},dnav:(_,e)=>{dp.ref=L.moverPeriodo(dp.modo,dp.ref,+e.dataset.n);go()},
eat:id=>{const a=D.atividades.find(x=>x.id===id);modal('Editar atividade',sel('conc','Concurso',opts(D.concursos.map(c=>[c.id,c.nome]),a.conc))+fdisc(a.disc)+fld('topico','Conteúdo','text',a.topico)+fld('min','Minutos previstos','number',a.min,'min=1 required'),f=>{Object.assign(a,{conc:f.conc,disc:f.disc.trim(),topico:f.topico,min:+f.min})})},
ndisc:()=>formDisc(),edisc:id=>formDisc(D.disciplinas.find(d=>d.id===id)),
xdisc:async id=>{const d=D.disciplinas.find(x=>x.id===id);if([...D.atividades,...D.sessoes,...D.questoes,...D.cards,...D.erros].some(x=>x.disc===d.nome))return alert('Disciplina com registros vinculados não pode ser excluída.');D.disciplinas=D.disciplinas.filter(x=>x!==d);await save();go()},
nconc:()=>formConc(),econc:id=>formConc(D.concursos.find(c=>c.id===id)),
xconc:async id=>{if(confirm('Excluir concurso? Os registros dele serão mantidos sem concurso.')){D.concursos=D.concursos.filter(c=>c.id!==id);await save();go()}},
nat:()=>{if(!ativos().length)return alert('Cadastre um concurso em preparação primeiro.');modal('Nova atividade',sel('conc','Concurso',concOpts())+fdisc()+fld('topico','Conteúdo')+fld('data','Data','date',hoje(),'required')+fld('min','Minutos previstos','number','60','min=1 required'),f=>{D.atividades.push({id:uid(),conc:f.conc,disc:f.disc.trim(),topico:f.topico,data:f.data,min:+f.min,status:'pendente',ordem:D.atividades.length,feitoEm:null,hist:[]})})},
xat:async id=>{if(confirm('Excluir atividade?')){D.atividades=D.atividades.filter(a=>a.id!==id);await save();go()}},
st:id=>{const a=D.atividades.find(x=>x.id===id);modal('Status',sel('s','Status',opts([['pendente','Pendente'],['andamento','Em andamento'],['concluida','Concluída'],['pulada','Pulada']],a.status)),f=>{setSt(a,f.s)})},
ok:async id=>{const a=D.atividades.find(x=>x.id===id);setSt(a,'concluida');await save();go()},
pul:async id=>{const a=D.atividades.find(x=>x.id===id);setSt(a,'pulada');await save();go()},
reag:id=>{const a=D.atividades.find(x=>x.id===id);modal('Reagendar',fld('data','Nova data','date',a.data,'required'),f=>{a.hist.push({d:hoje(),de:a.data,para:f.data,tipo:'reagendada'});a.data=f.data;setSt(a,'pendente')})},
ini:async id=>{if(D.timer)return alert('Já existe um cronômetro ativo.');const a=D.atividades.find(x=>x.id===id);setSt(a,'andamento');D.timer={conc:a.conc,disc:a.disc,topico:a.topico,act:a.id,acc:0,ini:Date.now(),run:true};await save();tab='estudos';go()},
tn:()=>{if(!ativos().length)return alert('Cadastre um concurso em preparação primeiro.');modal('Iniciar estudo',sel('conc','Concurso',concOpts())+fdisc()+fld('topico','Tópico'),f=>{D.timer={conc:f.conc,disc:f.disc.trim(),topico:f.topico,act:null,acc:0,ini:Date.now(),run:true}})},
tp:async()=>{D.timer.acc=tAtual();D.timer.run=false;await save();go()},tc:async()=>{D.timer.ini=Date.now();D.timer.run=true;await save();go()},
tx:async()=>{if(confirm('Descartar o tempo contado?')){D.timer=null;await save();go()}},
tf:()=>{const t=D.timer,seg=tAtual();t.acc=seg;t.run=false;modal('Finalizar sessão',fld('min','Duração (min) — editável','number',Math.round(seg/60),'min=1 required')+sel('metodo','Método',opts(['Teoria','Videoaula','Leitura','Questões','Revisão','Outro'].map(x=>[x,x])))+(t.act?'<label><input type="checkbox" name="done" style="width:auto"> Marcar atividade como concluída</label>':''),f=>{sessao(t.conc,t.disc,t.topico,f.min*60,f.metodo,hoje(),t.act);if(t.act&&f.done){setSt(D.atividades.find(x=>x.id===t.act),'concluida')}D.timer=null})},
ns:()=>{if(!ativos().length)return alert('Cadastre um concurso em preparação primeiro.');modal('Registro manual',sel('conc','Concurso',concOpts())+fdisc()+fld('topico','Tópico')+fld('data','Data','date',hoje(),'required')+fld('min','Minutos','number','','min=1 required')+sel('metodo','Método',opts(['Teoria','Videoaula','Leitura','Questões','Revisão','Outro'].map(x=>[x,x]))),f=>{sessao(f.conc,f.disc.trim(),f.topico,f.min*60,f.metodo,f.data)})},
xs:async id=>{if(confirm('Excluir sessão?')){D.sessoes=D.sessoes.filter(s=>s.id!==id);await save();go()}},
nq:()=>{if(!ativos().length)return alert('Cadastre um concurso em preparação primeiro.');modal('Registrar questões',sel('conc','Concurso',concOpts())+fdisc()+fld('topico','Tópico')+fld('data','Data','date',hoje(),'required')+fld('fonte','Plataforma/fonte')+fld('total','Total','number','','min=1 required')+fld('acertos','Acertos','number','','min=0 required'),f=>{const t=+f.total,a=+f.acertos,er=L.validaQuestoes(t,a);if(er)return er;D.questoes.push({id:uid(),conc:f.conc,disc:f.disc.trim(),topico:f.topico,data:f.data,fonte:f.fonte,total:t,acertos:a});if(t>a)setTimeout(()=>{if(confirm((t-a)+' erro(s). Cadastrar no caderno de erros agora?')){A.ne(f.conc,f.disc.trim(),f.topico)}},100)})},
xq:async id=>{if(confirm('Excluir registro?')){D.questoes=D.questoes.filter(q=>q.id!==id);await save();go()}},
ne:(c,d,t)=>{if(!ativos().length)return alert('Cadastre um concurso em preparação primeiro.');const cc=typeof c==='string'?c:'';modal('Novo erro',sel('conc','Concurso',concOpts().replace(`value="${cc}"`,`value="${cc}" selected`))+fdisc(d)+fld('topico','Tópico',"text",t||'')+'<label>Enunciado</label><textarea name="enun" rows="4" required></textarea>'+fld('marcou','Resposta que marquei')+fld('correta','Resposta correta')+'<label>Explicação</label><textarea name="expl" rows="3"></textarea>'+sel('motivo','Motivo',opts(['Falta de conhecimento','Esquecimento','Interpretação incorreta','Desatenção','Confusão entre conceitos','Erro de cálculo','Falta de tempo','Outro'].map(x=>[x,x])))+fld('banca','Banca/fonte'),f=>{D.erros.push({id:uid(),conc:f.conc,disc:f.disc.trim(),topico:f.topico,enun:f.enun,marcou:f.marcou,correta:f.correta,expl:f.expl,motivo:f.motivo,banca:f.banca,data:hoje(),arq:false,revs:[]})})},
rev:async id=>{D.erros.find(e=>e.id===id).revs.push(hoje());await save();go()},arq:async id=>{D.erros.find(e=>e.id===id).arq=true;await save();go()},
e2c:async id=>{if(D.cards.some(c=>c.erro===id))return;const e=D.erros.find(x=>x.id===id);D.cards.push({id:uid(),erro:id,conc:e.conc,disc:e.disc,topico:e.topico,frente:e.enun,verso:(e.correta?'Correta: '+e.correta+'\n':'')+e.expl,prox:hoje(),criado:hoje(),s:null,hist:[]});await save();go()},
nc:()=>modal('Novo flashcard',sel('conc','Concurso (opcional)','<option value="">—</option>'+concOpts())+fdisc()+fld('topico','Tópico')+'<label>Frente</label><textarea name="frente" rows="3" required></textarea><label>Verso</label><textarea name="verso" rows="3" required></textarea>',f=>{D.cards.push({id:uid(),erro:null,conc:f.conc,disc:f.disc.trim(),topico:f.topico,frente:f.frente,verso:f.verso,prox:hoje(),criado:hoje(),s:null,hist:[]})}),
flip:()=>{fcShow=!fcShow;go()},gr:async(_,el)=>{sm2(fcAt,+el.dataset.g);fcShow=false;await save();go()},
cor:async(_,el)=>{D.cfg.cor=el.dataset.c;await save();go()},
exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='estudos-backup-'+hoje()+'.json';a.click()},
imp:()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const j=JSON.parse(await i.files[0].text());if(!j||!Array.isArray(j.concursos)||!Array.isArray(j.sessoes))throw 0;if(!confirm('Substituir os dados atuais pelo backup?'))return;D=L.migrar(Object.assign({},D,j));await save();go()}catch(e){alert('Arquivo inválido.')}};i.click()}};
function formDisc(d){d=d||{};modal(d.id?'Editar disciplina':'Nova disciplina',fld('nome','Nome','text',d.nome,'required')+'<label>Tópicos (um por linha)</label><textarea name="topicos" rows="5">'+esc((d.topicos||[]).join('\n'))+'</textarea><label>Concursos vinculados</label>'+D.concursos.map(c=>`<label style="display:block"><input type="checkbox" name="cs" value="${c.id}" style="width:auto" ${(d.concs||[]).includes(c.id)?'checked':''}> ${esc(c.nome)}</label>`).join(''),f=>{const n=f.nome.trim(),dup=D.disciplinas.find(x=>x.nome.toLowerCase()===n.toLowerCase()&&x!==d);if(dup)return'Já existe disciplina com esse nome.';const o={nome:n,topicos:f.topicos.split('\n').map(s=>s.trim()).filter(Boolean),concs:[].concat(f.cs||[])};if(d.id){if(d.nome!==n)[D.atividades,D.sessoes,D.questoes,D.cards,D.erros].flat().forEach(x=>{if(x.disc===d.nome)x.disc=n});Object.assign(d,o)}else D.disciplinas.push({id:uid(),...o})})}
function formConc(c={}){modal(c.id?'Editar concurso':'Novo concurso',fld('nome','Nome','text',c.nome,'required')+fld('orgao','Órgão','text',c.orgao)+fld('cargo','Cargo','text',c.cargo)+fld('banca','Banca','text',c.banca)+fld('prova','Data da prova','date',c.prova)+sel('edital','Edital',opts(['Sem edital','Edital publicado','Inscrições abertas'].map(x=>[x,x]),c.edital))+sel('status','Situação',opts([['preparacao','Em preparação'],['pausado','Pausado'],['concluido','Concluído'],['arquivado','Arquivado']],c.status||'preparacao')),f=>{if(c.id)Object.assign(c,f);else D.concursos.push({id:uid(),...f})})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;location.hash=tab;go();return}const a=e.target.closest('[data-a]');if(a&&A[a.dataset.a])A[a.dataset.a](a.dataset.id,a)});
document.addEventListener('change',async e=>{if(e.target.matches('[data-crc]')){cr.conc=e.target.value;go();return}if(e.target.matches('[data-dpc]')){dp.conc=e.target.value;go();return}if(e.target.matches('[data-dpd]')){dp.disc=e.target.value;go();return}const k=e.target.dataset.cfg,f=e.target.dataset.f,a=e.target.dataset.a;if(k){D.cfg[k]=k==='metaDia'?e.target.value*60:k==='modo'?e.target.value:+e.target.value;await save();go()}else if(f&&e.target.tagName==='SELECT'){fe[f]=e.target.value;go()}else if(a==='cor2'){D.cfg.cor=e.target.value;await save();go()}});
document.addEventListener('input',e=>{if(e.target.dataset.f==='q'){fe.q=e.target.value;const p=e.target.selectionStart;go();const i=$('[data-f=q]');i.focus();i.setSelectionRange(p,p)}});
(async()=>{await load();go();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script></body></html>
